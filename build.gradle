plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.1'
}

group = 'space.bsli'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'net.dv8tion:JDA:5.5.0'
    implementation 'org.json:json:20260719'
}

shadowJar {
    archiveClassifier.set('')
    manifest {
        attributes 'Main-Class': 'space.bsli.Main'
    }
}

// Ensure ./gradlew build runs shadowJar
tasks.build {
    dependsOn tasks.shadowJar
}

// Custom local execution task (./gradlew run)
tasks.register('run', JavaExec) {
    group = 'application'
    description = 'Runs the Discord bot locally'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'space.bsli.Main'
}

test {
    useJUnitPlatform()
}