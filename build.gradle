plugins {
    id 'java'
    id 'application'
    id("com.gradleup.shadow") version "8.3.1"
}

group = 'space.bsli'
version = '1.0-SNAPSHOT'

application {
    mainClass = 'space.bsli.Main'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation("net.dv8tion:JDA:5.5.0");
    implementation 'org.json:json:20260719'
}

test {
    useJUnitPlatform()
}